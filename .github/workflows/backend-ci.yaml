name: "CI: Backend Quality Gates"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "starter/backend/**"

env:
  PY_VER: "3.10"
  APP_ROOT: starter/backend

jobs:
  lint:
    name: "Lint (flake8)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python ${{ env.PY_VER }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VER }}

      - name: Set up pipenv and install packages
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev

      - name: Cache the virtual environment
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: backend-venv-${{ hashFiles('starter/backend/Pipfile.lock') }}

      - name: Enforce flake8 style rules
        run: pipenv run lint