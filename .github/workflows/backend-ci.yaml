# ------------------------------------------------------------------
# backend-ci.yaml
# Runs on every PR that touches starter/backend/**, also manual.
# Jobs: code-lint, unit-tests run concurrently → docker-verify gates on both.
# ------------------------------------------------------------------

name: Backend PR Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "starter/backend/**"

env:
  SRC_DIR: starter/backend
  PYTHON_VERSION: "3.10"

jobs:

  code-lint:
    name: Flake8 Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Prepare Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bootstrap pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev

      - name: Preserve virtualenv cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: py-deps-${{ hashFiles('starter/backend/Pipfile.lock') }}

      - name: Check code style
        run: pipenv run lint

  unit-tests:
    name: Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Prepare Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bootstrap pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev

      - name: Preserve virtualenv cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: py-deps-${{ hashFiles('starter/backend/Pipfile.lock') }}

      - name: Run test cases
        run: pipenv run test

  docker-verify:
    name: Docker Build Check
    needs: [code-lint, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Attempt Docker build (no push)
        run: |
          docker build \
            --tag be-ci-verify:${{ github.sha }} \
            ./${{ env.SRC_DIR }}
          echo "Docker build passed for commit ${{ github.sha }}"