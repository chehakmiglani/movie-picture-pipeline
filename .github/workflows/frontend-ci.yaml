# ------------------------------------------------------------------
# frontend-ci.yaml
# Runs on every PR that touches starter/frontend/**, also manual.
# Jobs: code-lint, unit-tests run concurrently → docker-verify gates on both.
# ------------------------------------------------------------------

name: Frontend PR Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "starter/frontend/**"

env:
  SRC_DIR: starter/frontend
  NODE_VERSION: "18"

jobs:

  code-lint:
    name: ESLint Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Prepare Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Restore packages
        run: npm ci

      - name: Check code style
        run: npm run lint

  unit-tests:
    name: Jest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Prepare Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Restore packages
        run: npm ci

      - name: Run tests in CI mode
        run: CI=true npm test

  docker-verify:
    name: Docker Build Check
    needs: [code-lint, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Attempt Docker build (no push)
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=http://localhost:5000 \
            --tag fe-ci-verify:${{ github.sha }} \
            ./${{ env.SRC_DIR }}
          echo "Docker build passed for commit ${{ github.sha }}"