# =============================================================
# Frontend CI — Pull Request Quality Checks
#
# Validates frontend code on every PR to main.
# ESLint and Jest run side-by-side for faster feedback,
# and the Docker build step only fires once both pass.
# =============================================================

name: "CI: Frontend Quality Gates"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "starter/frontend/**"

env:
  NODE_VER: "18"
  APP_ROOT: starter/frontend

jobs:
  lint:
    name: "Lint (ESLint)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js ${{ env.NODE_VER }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VER }}
          cache: npm
          cache-dependency-path: ${{ env.APP_ROOT }}/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Enforce ESLint rules
        run: npm run lint

  test:
    name: "Test (Jest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js ${{ env.NODE_VER }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VER }}
          cache: npm
          cache-dependency-path: ${{ env.APP_ROOT }}/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run the Jest test suite
        run: CI=true npm test

  build:
    name: "Build Docker Image"
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile frontend Docker image (no push)
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=http://localhost:5000 \
            --tag frontend-ci:${{ github.sha }} \
            ./${{ env.APP_ROOT }}