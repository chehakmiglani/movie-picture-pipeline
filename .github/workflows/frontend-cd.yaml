# ------------------------------------------------------------------
# frontend-cd.yaml
# Pushes to main touching starter/frontend/** trigger this, also manual.
# Stages: code-lint + unit-tests (parallel) → container-publish → k8s-release
# The build step discovers the backend URL from EKS so React
# can call the API at runtime.
# ------------------------------------------------------------------

name: Frontend Release Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "starter/frontend/**"

env:
  SRC_DIR: starter/frontend
  NODE_VERSION: "18"
  CLOUD_REGION: us-east-1
  REGISTRY_NAME: frontend
  CLUSTER_NAME: cluster

jobs:

  # ─── Gate 1: Lint ─────────────────────────────────────────────

  code-lint:
    name: ESLint Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Prepare Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Restore packages
        run: npm ci

      - name: Check code style
        run: npm run lint

  # ─── Gate 2: Tests ────────────────────────────────────────────

  unit-tests:
    name: Jest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Prepare Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Restore packages
        run: npm ci

      - name: Run tests in CI mode
        run: CI=true npm test

  # ─── Build container & push to registry ───────────────────────

  container-publish:
    name: Containerize & Push ECR
    needs: [code-lint, unit-tests]
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build_push.outputs.image_uri }}
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Authenticate AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.CLOUD_REGION }}

      - name: ECR login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/v1.28.4/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl

      - name: Discover backend service endpoint
        id: discover_be
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.CLOUD_REGION }}

          HOST=$(kubectl get svc backend \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          if [ -z "$HOST" ]; then
            echo "::error::Cannot resolve backend hostname. Run backend CD first."
            exit 1
          fi
          echo "url=http://${HOST}" >> "$GITHUB_OUTPUT"

      - name: Build image and push to ECR
        id: build_push
        working-directory: starter/frontend
        run: |
          TAG="${{ steps.ecr.outputs.registry }}/${{ env.REGISTRY_NAME }}:${{ github.sha }}"
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=${{ steps.discover_be.outputs.url }} \
            --tag "$TAG" .
          docker push "$TAG"
          echo "image_uri=${TAG}" >> "$GITHUB_OUTPUT"

  # ─── Roll out to Kubernetes ───────────────────────────────────

  k8s-release:
    name: EKS Rollout
    needs: container-publish
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Authenticate AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.CLOUD_REGION }}

      - name: Get kubectl + kustomize
        run: |
          curl -sLO "https://dl.k8s.io/release/v1.28.4/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo install kustomize /usr/local/bin/kustomize

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.CLOUD_REGION }}

      - name: Patch manifests and deploy
        working-directory: starter/frontend/k8s
        run: |
          kustomize edit set image frontend=${{ needs.container-publish.outputs.image_uri }}
          kustomize build | kubectl apply -f -

      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=180s || true
          echo "----- Logging - kubectl get all ---- "
          kubectl get all
          echo "----- Logging - kubectl describe deploy ----- "
          kubectl describe deploy frontend

      - name: Verify Frontend ECR image
        run: |
          echo "----- Logging - Frontend ECR Image Details ----- "
          AWS_PAGER="" aws ecr describe-images \
            --repository-name frontend \
            --region us-east-1 \
            --query 'sort_by(imageDetails,&imagePushedAt)[-1].{Tags:imageTags,Digest:imageDigest,PushedAt:imagePushedAt}' \
            --output table