# ------------------------------------------------------------------
# backend-cd.yaml
# Pushes to main touching starter/backend/** trigger this, also manual.
# Stages: code-lint + unit-tests (parallel) → container-publish → k8s-release
# ------------------------------------------------------------------

name: Backend Release Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "starter/backend/**"

env:
  SRC_DIR: starter/backend
  PYTHON_VERSION: "3.10"
  CLOUD_REGION: us-east-1
  REGISTRY_NAME: backend
  CLUSTER_NAME: cluster

jobs:

  # ─── Gate 1: Lint ─────────────────────────────────────────────

  code-lint:
    name: Flake8 Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Prepare Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bootstrap pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev

      - name: Preserve virtualenv cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: py-deps-${{ hashFiles('starter/backend/Pipfile.lock') }}

      - name: Check code style
        run: pipenv run lint

  # ─── Gate 2: Tests ────────────────────────────────────────────

  unit-tests:
    name: Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Prepare Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bootstrap pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev

      - name: Preserve virtualenv cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: py-deps-${{ hashFiles('starter/backend/Pipfile.lock') }}

      - name: Run test cases
        run: pipenv run test

  # ─── Build container & push to registry ───────────────────────

  container-publish:
    name: Containerize & Push ECR
    needs: [code-lint, unit-tests]
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build_push.outputs.image_uri }}
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Authenticate AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.CLOUD_REGION }}

      - name: ECR login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image and push to ECR
        id: build_push
        working-directory: starter/backend
        run: |
          TAG="${{ steps.ecr.outputs.registry }}/${{ env.REGISTRY_NAME }}:${{ github.sha }}"
          docker build --tag "$TAG" .
          docker push "$TAG"
          echo "image_uri=${TAG}" >> "$GITHUB_OUTPUT"

  # ─── Roll out to Kubernetes ───────────────────────────────────

  k8s-release:
    name: EKS Rollout
    needs: container-publish
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Authenticate AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.CLOUD_REGION }}

      - name: Get kubectl + kustomize
        run: |
          curl -sLO "https://dl.k8s.io/release/v1.28.4/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo install kustomize /usr/local/bin/kustomize

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.CLOUD_REGION }}

      - name: Patch manifests and deploy
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image backend=${{ needs.container-publish.outputs.image_uri }}
          kustomize build | kubectl apply -f -

      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/backend --timeout=180s || true
          echo "----- Logging - kubectl get all ---- "
          kubectl get all
          echo "----- Logging - kubectl describe deploy ----- "
          kubectl describe deploy backend

      - name: Verify Backend ECR image
        run: |
          echo "----- Logging - Backend ECR Image Details ----- "
          AWS_PAGER="" aws ecr describe-images \
            --repository-name backend \
            --region us-east-1 \
            --query 'sort_by(imageDetails,&imagePushedAt)[-1].{Tags:imageTags,Digest:imageDigest,PushedAt:imagePushedAt}' \
            --output table
